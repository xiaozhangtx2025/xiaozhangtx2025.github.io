	<style>
		:root {
			--primary-color: 230, 247, 255;
			--secondary-color: 255, 182, 193;
			--blur-strength: 30px;
		}

		body {
			margin: 0;
			height: 100%;
			/* background: linear-gradient(135deg, #e0e5ec, #ffffff); */
			background: linear-gradient(145deg,
					rgba(var(--primary-color), 0.7),
					rgba(var(--secondary-color), 0.6));
			color: #000;
			font-family: -apple-system, BlinkMacSystemFont, sans-serif;
		}

		.controls {
			position: absolute;
			top: 20px;
			right: 20px;
			display: flex;
			flex-direction: column;
			gap: 12px;
			z-index: 9999;
		}

		.custom-select {
			position: relative;
			width: 220px;
			user-select: none;
		}

		.select-display {
			background: rgba(255, 255, 255, 0.3);
			backdrop-filter: blur(10px) saturate(150%);
			-webkit-backdrop-filter: blur(10px) saturate(150%);
			border: 1px solid rgba(0, 0, 0, 0.1);
			border-radius: 20px;
			padding: 10px 16px;
			color: #000;
			cursor: pointer;
			font-size: 16px;
			box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
		}

		.select-options {
			position: absolute;
			width: 100%;
			list-style: none;
			margin: 8px 0 0;
			padding: 0;
			background: rgba(255, 255, 255, 0.3);
			backdrop-filter: blur(10px) saturate(150%);
			-webkit-backdrop-filter: blur(10px) saturate(150%);
			border-radius: 20px;
			border: 1px solid rgba(0, 0, 0, 0.1);
			overflow: hidden;
			display: none;
			box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
			z-index: 10000;
		}

		.select-options li {
			padding: 10px 16px;
			color: #000;
			font-size: 16px;
			cursor: pointer;
		}

		.select-options li:hover {
			background: rgba(0, 0, 0, 0.1);
		}

		#main {
			width: calc(100% - 40px);
			height: calc(100% - 40px);
			margin: 20px;
			background: rgba(255, 255, 255, 0.2);
			backdrop-filter: blur(10px) saturate(150%);
			-webkit-backdrop-filter: blur(10px) saturate(150%);
			border-radius: 12px;
			box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
		}
	</style>
</head>

			"A/C": "能猫金币 / 能猫铜币"
		};

		function createSelect(id, options, onChange) {
			const container = document.getElementById(id);
			const display = document.createElement('div');
			display.className = 'select-display';
			display.textContent = '请选择 ▾';

			const list = document.createElement('ul');
			list.className = 'select-options';

			options.forEach(opt => {
				const li = document.createElement('li');
				li.dataset.value = opt.value;
				li.textContent = opt.label;
				list.appendChild(li);
			});

			display.addEventListener('click', () => {
				list.style.display = list.style.display === 'block' ? 'none' : 'block';
			});

			list.addEventListener('click', e => {
				if (e.target.tagName === 'LI') {
					display.textContent = e.target.textContent + ' ▾';
					list.style.display = 'none';
					onChange(e.target.dataset.value);
				}
			});

			document.addEventListener('click', e => {
				if (!container.contains(e.target)) {
					list.style.display = 'none';
				}
			});

			container.appendChild(display);
			container.appendChild(list);
		}

		const pairs = [
			{ value: 'A/B', label: pairNames['A/B'] },
			{ value: 'B/C', label: pairNames['B/C'] },
			{ value: 'A/C', label: pairNames['A/C'] }
		];

		let selectedMonth = null;
		let selectedPair = null;

		createSelect('pairSelect', pairs, value => {
			selectedPair = value;
			if (selectedMonth) {
				updateChart(selectedMonth, selectedPair);
			}
		});

		createSelect('monthSelect', [

			{ value: '2025 August', label: '2025 August' },

			{ value: '2025 December', label: '2025 December' }
		], value => {
			selectedMonth = value;
			if (selectedPair) {

			}
		});


		const myChart = echarts.init(document.getElementById('main'), null, {

		});

			title: {

				textStyle: { fontSize: 24, fontWeight: 'bold', color: '#000' },
				left: 'center'
			},
			tooltip: { trigger: 'axis', borderRadius: 15 },
			grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
			xAxis: {
				type: 'category',
				boundaryGap: false,
				data: [],
				axisLine: { lineStyle: { color: '#ccc' } },
				axisLabel: { color: '#666' }
			},
			yAxis: {
				type: 'value',
				name: '比率值',
				nameTextStyle: { color: '#333' },
				axisLine: { lineStyle: { color: '#ccc' } },
				axisLabel: { color: '#666' }
			},
			series: []
		};

		function calcAxisSettings(minVal, maxVal) {
			let digits;
			if (maxVal >= 50) {
				digits = 0;
			} else if (maxVal >= 10) {
				digits = 1;
			} else {
				digits = 2;
			}

			let margin = (maxVal - minVal) * 0.05 || 0.5;
			if (margin < 0.1) margin = 0.1;

			const yMin = +(Math.floor((minVal - margin) * Math.pow(10, digits)) / Math.pow(10, digits)).toFixed(digits);
			const yMax = +(Math.ceil((maxVal + margin) * Math.pow(10, digits)) / Math.pow(10, digits)).toFixed(digits);
			const interval = +(((yMax - yMin) / 5).toFixed(digits));

			return { yMin, yMax, interval, digits };
		}

		function updateChart(month, pair) {
			const monthData = dataStore[month];
			if (!monthData) return;

			const monthNumberMap = {
				"2025 July": 7,
				"2025 August": 8,
				"2025 September": 9,
				"2025 October": 10,
				"2025 November": 11,
				"2025 December": 12
			};

			const days = monthData.days.map(d => {
				const m = monthNumberMap[month];
				return `${m}.${d}`;
			});


			const values = monthData.rates[pair];
			const minVal = Math.min(...values);
			const maxVal = Math.max(...values);

			const { yMin, yMax, interval, digits } = calcAxisSettings(minVal, maxVal);

			myChart.setOption({
				...baseOption,
				title: {
					...baseOption.title,
					text: `${month} 能猫币汇率 - ${pairNames[pair]}`
				},
				xAxis: {
					...baseOption.xAxis,
					data: days
				},
				yAxis: {
					...baseOption.yAxis,
					min: yMin,
					max: yMax,
					interval: interval,
					axisLabel: {
						formatter: value => value.toFixed(digits)
					}
				},
				series: [
					{
						name: pairNames[pair],
						type: 'line',
						smooth: true,
						data: values,
						symbol: 'circle',
						symbolSize: 6,
						itemStyle: {
							color: '#3E71F7',
							shadowColor: 'rgba(62, 113, 247, 0.3)',
							shadowBlur: 10
						},
						lineStyle: { width: 3 },
						areaStyle: {
							color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
								{ offset: 0, color: 'rgba(62, 113, 247, 0.2)' },
								{ offset: 1, color: 'rgba(62, 113, 247, 0)' }
							])
						}
					}
				]
			});
		}
